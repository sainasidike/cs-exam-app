<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>试卷智能助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #f0f0f3; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .iphone-frame {
      position: relative;
      width: 383px;
      height: 842px;
      background: #1c1c1e;
      border-radius: 52px;
      padding: 5px;
      box-shadow:
        0 0 0 1px #4a4a4e,
        0 30px 80px rgba(0,0,0,0.35),
        0 10px 30px rgba(0,0,0,0.2);
    }
    /* Dynamic Island */
    .iphone-frame::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: #000;
      border-radius: 18px;
      z-index: 9999;
    }
    /* Home Indicator */
    .iphone-frame::after {
      content: '';
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 5px;
      background: #000;
      border-radius: 3px;
      opacity: 0.25;
      z-index: 9999;
    }
    /* Side buttons */
    .iphone-btn-right {
      position: absolute;
      right: -3px;
      top: 180px;
      width: 3px;
      height: 90px;
      background: #3a3a3c;
      border-radius: 0 2px 2px 0;
    }
    .iphone-btn-left-1 {
      position: absolute;
      left: -3px;
      top: 150px;
      width: 3px;
      height: 30px;
      background: #3a3a3c;
      border-radius: 2px 0 0 2px;
    }
    .iphone-btn-left-2 {
      position: absolute;
      left: -3px;
      top: 210px;
      width: 3px;
      height: 60px;
      background: #3a3a3c;
      border-radius: 2px 0 0 2px;
    }
    .iphone-btn-left-3 {
      position: absolute;
      left: -3px;
      top: 280px;
      width: 3px;
      height: 60px;
      background: #3a3a3c;
      border-radius: 2px 0 0 2px;
    }
    .iphone-screen {
      width: 100%;
      height: 100%;
      border-radius: 47px;
      overflow: hidden;
      background: #fff;
      position: relative;
    }
    /* Status bar */
    .iphone-statusbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px 0;
      z-index: 9998;
      pointer-events: none;
      color: #fff;
      font-family: -apple-system, 'SF Pro Text', sans-serif;
      font-size: 14px;
      font-weight: 600;
    }
    .iphone-statusbar-time { font-size: 15px; font-weight: 700; }
    .iphone-statusbar-icons { display: flex; align-items: center; gap: 5px; font-size: 12px; }
    #root {
      width: 100%;
      height: 100%;
    }
    /* Hide scrollbar */
    .iphone-screen *::-webkit-scrollbar { display: none; }
    .iphone-screen * { scrollbar-width: none; }

    @media (max-width: 500px) {
      html, body { background: #fff; }
      body { align-items: stretch; justify-content: stretch; }
      .iphone-frame {
        width: 100%;
        height: 100%;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
        background: none;
      }
      .iphone-frame::before,
      .iphone-frame::after { display: none; }
      .iphone-btn-right,
      .iphone-btn-left-1,
      .iphone-btn-left-2,
      .iphone-btn-left-3 { display: none; }
      .iphone-screen { border-radius: 0; }
      .iphone-statusbar { display: none; }
    }
  </style>
</head>
<body>
  <div class="iphone-frame">
    <div class="iphone-btn-right"></div>
    <div class="iphone-btn-left-1"></div>
    <div class="iphone-btn-left-2"></div>
    <div class="iphone-btn-left-3"></div>
    <div class="iphone-screen">
      <div class="iphone-statusbar">
        <span class="iphone-statusbar-time">9:41</span>
        <span class="iphone-statusbar-icons">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M1.5 4h1a.5.5 0 01.5.5v6a.5.5 0 01-.5.5h-1a.5.5 0 01-.5-.5v-6a.5.5 0 01.5-.5zm3.5-2h1a.5.5 0 01.5.5v8a.5.5 0 01-.5.5H5a.5.5 0 01-.5-.5v-8A.5.5 0 015 2zm3.5-1.5h1a.5.5 0 01.5.5v9.5a.5.5 0 01-.5.5h-1a.5.5 0 01-.5-.5V1a.5.5 0 01.5-.5zM12 0h1a.5.5 0 01.5.5v10a.5.5 0 01-.5.5h-1a.5.5 0 01-.5-.5V.5A.5.5 0 0112 0z"/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 2.8a6.5 6.5 0 014.6 1.9.5.5 0 010 .7l-.7.7a.5.5 0 01-.7 0A4.8 4.8 0 007.5 4.8a4.8 4.8 0 00-3.2 1.3.5.5 0 01-.7 0l-.7-.7a.5.5 0 010-.7A6.5 6.5 0 017.5 2.8zm0 3a3.5 3.5 0 012.4 1 .5.5 0 010 .7l-.7.7a.5.5 0 01-.7 0 1.8 1.8 0 00-2 0 .5.5 0 01-.7 0l-.7-.7a.5.5 0 010-.7 3.5 3.5 0 012.4-1zm0 3a.8.8 0 110 1.6.8.8 0 010-1.6z"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11" fill="currentColor"><rect x="0" y="1" width="21" height="9" rx="2" ry="2" stroke="currentColor" stroke-width="1" fill="none" opacity="0.4"/><rect x="1.5" y="2.5" width="17" height="6" rx="1" ry="1"/><path d="M22 4v3a1.5 1.5 0 000-3z" opacity="0.4"/></svg>
        </span>
      </div>
      <div id="root"></div>
    </div>
  </div>
  <script type="module" src="/src/exam/main.jsx"></script>
</body>
</html>
